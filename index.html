<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F1E7" />
    <title>KK Engravings</title>
    <meta name="description" content="KK Engravings · personalized engravings, wooden gifts, and handcrafted creative products by Kaundinya Kapila." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Netlify Forms detector template. Netlify scans deployed HTML at build time
      for forms with `netlify` attribute and registers them by name. Real
      submissions are sent from the React checkout via fetch("/", form-encoded,
      form-name=kk-engravings-order). This block is never rendered.
    -->
    <form name="kk-engravings-order" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="customer_name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="address_line1" />
      <input type="text" name="address_line2" />
      <input type="text" name="city" />
      <input type="text" name="state" />
      <input type="text" name="zip" />
      <textarea name="order_details"></textarea>
    </form>
    <form name="kk-engravings-custom" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="customer_name" />
      <input type="email" name="email" />
      <input type="text" name="occasion" />
      <textarea name="idea"></textarea>
    </form>
  </body>
</html>
